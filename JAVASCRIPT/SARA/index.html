<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body>
    <div class="container-fluid d-flex justify-content-center aling-items-center pt-5">
            <div class="card col-lg-2 col-md-6 col-sm-12 d-flex flex-column justify-content-center aling-items-center">
                <div class="text-center" >
                    <img src="https://img.freepik.com/psd-gratis/logo-gradiente-abstracto_23-2150689648.jpg" style="width: 80%;" class="img-fluid" alt="">
                </div>
                <div class="card-body ">
                    <div class="">
                        <label for="" class="label-control">Usuario</label>
                        <input id="emailUser" type="text" class="form-control">
                    </div>
                    <div class="">
                        <label for="" class="label-control">Password</label>
                        <input id="passwordUser" type="text" class="form-control">
                    </div>
                    <div class="mt-4 text-center">
                        <input type="button" onclick="accessUser()"  class="btn btn-success col-6 "  value="Acceder">
                    </div>
                    <small class="mt-5">¿No tienes cuenta? registrate <a style="cursor: pointer;"  class="text-primary" data-bs-toggle="modal" data-bs-target="#registroAprendiz" >aquí</a></small>
                </div>
            </div>
    </div>



     <!-- Modal -->
     <div class="modal fade" id="registroAprendiz" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="exampleModalLabel" aria-hidden="true">
     <div class="modal-dialog">
         <div class="modal-content">
             <div class="modal-header">
                 <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                 <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
             </div>
             <div class="modal-body">
                 <div class="card-body">

                     <div>
                         <label for="" class="label-control">Documento</label>
                         <input required id="documento" onchange="validatorDocumentExisting()"
                             onkeyup="validatorLength()" type="number" class="form-control" placeholder="Documento">
                     </div>
                     <div>
                         <label for="" class="label-control">Nombre</label>
                         <input required id="nombre" type="text" name="hola" class="form-control"
                             placeholder="Nombre">
                     </div>
                     <div>
                         <label for="" class="label-control">Apellidos</label>
                         <input required id="apellidos" type="text" class="form-control" placeholder="Apellidos">
                     </div>
                     <div class="row">
                        <div class="col-6">
                            <div>
                                <label for="" class="label-control">Sexo</label>
                                <select required id="sexo" type="text" class="form-control">
                                    <option selected>seleccione...</option>
                                    <option value="Hombre">Hombre</option>
                                    <option value="Mujer">Mujer</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-6">
                            <div>
                                <label for="" class="label-control">Programa</label>
                                <input required id="programa" type="text" class="form-control" placeholder="Programa">
                            </div>
                        </div>
                     </div>
                     
                     <div class="row">
                        <div class="col-4">
                            <div>
                                <label for="" class="label-control">Trimestre</label>
                                <input required id="trimestre" type="text" class="form-control" placeholder="Trimestre">
                            </div>
                        </div>
                        <div class="col-8">
                            <div>
                                <label for="" class="label-control">Dirección</label>
                                <input required id="direccion" type="text" class="form-control" placeholder="Dirección">
                            </div>
                        </div>
                     </div>
                    
                    
                     <div>
                        <label for="" class="label-control">Correo eléctronico</label>
                        <input required id="email" type="text" class="form-control" placeholder="Trimestre">
                    </div>
                    <div>
                        <label for="" class="label-control">Contraseña</label>
                        <input required id="password" type="text" class="form-control" placeholder="Dirección">
                    </div>
                    <div>
                        <label for="" class="label-control">Foto perfil</label>
                        <input required id="fotoPerfil" type="file" class="form-control" placeholder="Perfil">
                    </div>
                 </div>
             </div>
             <div class="modal-footer">
                 <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                 <button type="button" class="btn btn-primary" onclick="RegistroAprendiz()" data-bs-dismiss="modal">Guardar</button>
             </div>


         </div>
     </div>
 </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="assets/main.js"></script>
    <script src="assets/acces.controller.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
