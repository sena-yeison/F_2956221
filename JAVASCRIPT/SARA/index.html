<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    
    <div class="container-fluid">
        <div class="row w-100 pt-4">
            <div class="col-3 vh-100 d-flex aling-items-center flex-column  justify-content-center">
                <div class="card border">
                    <div class="card-header">REGISTRO DE APRENDICES</div>
                    <div class="card-body">

                            <div>
                                <label for="" class="label-control">Documento</label>
                                <input required id="documento" onchange="validatorDocumentExisting()" onkeyup="validatorLength()" type="number" class="form-control" placeholder="Documento">
                            </div>
                            <div>
                                <label for="" class="label-control">Nombre</label>
                                <input required id="nombre" type="text" name="hola" class="form-control" placeholder="Nombre">
                            </div>
                            <div>
                                <label for="" class="label-control">Apellidos</label>
                                <input required id="apellidos" type="text" class="form-control" placeholder="Apellidos">
                            </div>
                            <div>
                                <label for="" class="label-control">Sexo</label>
                                <select required id="sexo" type="text" class="form-control">
                                    <option selected>seleccione...</option>
                                    <option value="Hombre">Hombre</option>
                                    <option value="Mujer">Mujer</option>
                                </select>
                            </div>
                            <div>
                                <label for="" class="label-control">Programa</label>
                                <input required id="programa" type="text" class="form-control" placeholder="Programa">
                            </div>
                            <div>
                                <label for="" class="label-control">Trimestre</label>
                                <input required id="trimestre" type="text" class="form-control" placeholder="Trimestre">
                            </div>
                            <div>
                                <label for="" class="label-control">Dirección</label>
                                <input required id="direccion" type="text" class="form-control" placeholder="Dirección">
                            </div>
                            
                            <div class="mt-3">
                                <input required type="button" onclick="RegistroAprendiz()" class="btn btn-primary col-12" value="Guardar"/>
                            </div>
                    </div>
                </div>
            </div>
            <div class="col-9 vh-100 mt-4 d-flex aling-items-center flex-column  ">
                <div class="card">
                    <div class="card-header">
                        <h2>Listado de aprendices</h2>
                    </div>
                    <div class="card-body">
                        <table class="table" id="tableAprendices">
                            <thead>
                              <tr>
                                <th scope="col">Item</th>
                                <th scope="col">Documento</th>
                                <th scope="col">Nombres</th>
                                <th scope="col">Programa</th>
                                <th scope="col">Dirección</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                              </tr>
                            </thead>
                            <tbody id="tbody-table">
                              <tr >
                                
                              </tr>
                            </tbody>
                          </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="assets/aprendiz.controller.js"></script>
    <script src="assets/main.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
